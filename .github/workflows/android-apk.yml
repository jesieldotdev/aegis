name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gera o wrapper do Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Publica o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
